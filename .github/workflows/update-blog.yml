name: Update blog posts in README

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts from reddi.tech
        run: curl -s https://www.reddi.tech/feed.xml > feed.xml

      - name: Parse and inject blog posts
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import re

          tree = ET.parse('feed.xml')
          root = tree.getroot()
          items = root.findall('.//item')[:5]
          lines = []
          for item in items:
              title = item.find('title').text.strip()
              link = item.find('link').text.strip().replace('https://reddi.ai', 'https://reddi.tech')
              pub = item.find('pubDate').text.strip()[:16]
              lines.append(f'- [{title}]({link}) — {pub}')

          block = '
'.join(lines)
          with open('README.md', 'r') as f:
              content = f.read()

          replacement = f'<!-- BLOG_POSTS_START -->
<!-- Auto-updated daily via GitHub Actions — source: reddi.tech/feed.xml -->
{block}
<!-- BLOG_POSTS_END -->'
          content = re.sub(r'<!-- BLOG_POSTS_START -->.*?<!-- BLOG_POSTS_END -->', replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(content)
          print(f"Injected {len(items)} posts")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "reddinft"
          git config user.email "reddinft@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: update latest blog posts from reddi.tech" &&
            git push
          )
